AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Enterprise PII Guardrails: 1-Click AWS EC2 Deployment.
  Launches a hardened, production-ready instance preconfigured with an active evaluation license,
  persistent encrypted storage, and automated systemd container management.
  Visit https://piiguardrails.com for documentation.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Instance & Compute Configuration"
        Parameters:
          - InstanceType
          - KeyPairName
      - Label:
          default: "2. Web Studio Access & Security"
        Parameters:
          - AdminPassword
          - AllowedInboundCIDR
      - Label:
          default: "3. Evaluation & Licensing"
        Parameters:
          - TrialLicenseKey
      - Label:
          default: "4. Enterprise Branding & White-Labeling (Optional)"
        Parameters:
          - CompanyName
          - BrandLogoURL

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - c6i.large
      - m6i.large
    Description: >
      EC2 Instance Type. Select 't3.micro' or 't2.micro' for AWS Free Tier (100% free of charge).
      Select 't3.medium' (2 vCPU, 4GB RAM) or larger for high-throughput enterprise production.

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^(?!(admin|password|123456|root|guest|piiguardrail)$).*$"
    ConstraintDescription: >
      Password must be at least 8 characters long and cannot be default insecure values (admin, password, 123456).
    Description: >
      Master administrative password to access the Studio Web UI dashboard (user: admin).

  AllowedInboundCIDR:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: Must be a valid IPv4 CIDR range (e.g. 0.0.0.0/0 or 203.0.113.25/32).
    Description: >
      IPv4 CIDR block allowed to access the Studio Web UI and FastAPI endpoints on Port 8000.
      For production evaluations, we strongly recommend restricting this to your office/VPN CIDR.

  KeyPairName:
    Type: String
    Default: ""
    Description: >
      (Optional) Name of an existing EC2 Key Pair to enable SSH access on Port 22.
      Leave blank if you do not require SSH access.

  TrialLicenseKey:
    Type: String
    Default: "ED4-AQAGWNU7FAAAAJYQ-AAAAAAAAAAAAAKFI-VXRAU4YPAHXPW6JD-CRJIDR5NFJ4ITZA2-ICFCAEEV7OYVNWO7-JDSSZ5RMIUNDHULQ-DMZPYP4ICOFTJF53-AMKICAI6R57R4XM4-QYR4UGEQ4ZTP3DAM"
    Description: >
      Preconfigured evaluation license key. Provides instant evaluation access (10,000 requests quota) with zero configuration.
      Leave as default, or replace with your commercial license key if already issued.

  CompanyName:
    Type: String
    Default: "AWS Demo"
    Description: >
      Company or organization name for white-labeling the Web Studio and Reports (Default: 'AWS Demo').

  BrandLogoURL:
    Type: String
    Default: "/ui/logo.png"
    Description: >
      HTTPS URL or local path to company logo image (Default: '/ui/logo.png').

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: Dynamically resolves the latest official Amazon Linux 2023 AMI in this AWS Region.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable inbound traffic on Port 8000 and Port 22 for Enterprise PII Guardrails.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedInboundCIDR
          Description: Web Studio UI and REST API
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedInboundCIDR
          Description: SSH and EC2 Instance Connect terminal
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-SecurityGroup"
        - Key: Application
          Value: EnterprisePIIGuardrails

  GuardrailsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          echo "=========================================================="
          echo "Initializing Enterprise PII Guardrails 1-Click Environment"
          echo "=========================================================="

          # 0. Configure 2GB swap space to guarantee smooth performance on Free Tier micro instances
          if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # 1. Update OS packages and install Docker runtime (curl-minimal is pre-installed on AL2023)
          dnf update -y --allowerasing
          dnf install -y --allowerasing docker openssl
          systemctl enable --now docker

          # 2. Setup persistent host directory for encrypted SQLCipher database
          mkdir -p /opt/piiguardrails/data
          chmod 777 /opt/piiguardrails/data

          # 3. Generate high-entropy SQLCipher database encryption passphrase
          RANDOM_PASSPHRASE=$(openssl rand -hex 16)

          # 4. Write secure runtime environment file (restricted to root chmod 600)
          cat <<EOF > /etc/piiguardrails.env
          ACCEPT_LICENSE=true
          GUI_PASSWORD=${AdminPassword}
          SQLCIPHER_PASSPHRASE=${!RANDOM_PASSPHRASE}
          PRECONFIGURED_LICENSE_KEY=${TrialLicenseKey}
          COMPANY_NAME=${CompanyName}
          BRAND_LOGO=${BrandLogoURL}
          PORT=8000
          APP_PORT=8000
          APP_HOST=0.0.0.0
          DATA_DIR=/app/data
          EOF
          chmod 600 /etc/piiguardrails.env

          # 5. Create Systemd Service for continuous container availability
          cat <<'EOF' > /etc/systemd/system/piiguardrail.service
          [Unit]
          Description=Enterprise PII Guardrails Engine
          After=docker.service
          Requires=docker.service

          [Service]
          TimeoutStartSec=0
          Restart=always
          RestartSec=10
          ExecStartPre=-/usr/bin/docker stop pii-guardrail-app
          ExecStartPre=-/usr/bin/docker rm pii-guardrail-app
          ExecStartPre=/usr/bin/docker pull piiguardrails/enterprise-pii-guardrail:latest
          ExecStart=/usr/bin/docker run --name pii-guardrail-app \
            -p 8000:8000 \
            -v /opt/piiguardrails/data:/app/data \
            --env-file /etc/piiguardrails.env \
            piiguardrails/enterprise-pii-guardrail:latest
          ExecStop=/usr/bin/docker stop pii-guardrail-app

          [Install]
          WantedBy=multi-user.target
          EOF

          # 6. Enable and start service
          systemctl daemon-reload
          systemctl enable --now piiguardrail.service

          echo "=========================================================="
          echo "Enterprise PII Guardrails container launched successfully!"
          echo "=========================================================="
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Instance"
        - Key: Application
          Value: EnterprisePIIGuardrails

Outputs:
  WebUIURL:
    Description: Direct URL to the Enterprise PII Guardrails Studio Web UI.
    Value: !Sub "http://${GuardrailsInstance.PublicIp}:8000"

  APIDocsURL:
    Description: Interactive OpenAPI / Swagger documentation and test interface.
    Value: !Sub "http://${GuardrailsInstance.PublicIp}:8000/docs"

  PublicIP:
    Description: Public IPv4 Address of the deployed EC2 instance.
    Value: !GetAtt GuardrailsInstance.PublicIp

  HardwareIDGuide:
    Description: Instructions for discovering your instance Hardware ID to upgrade to production.
    Value: !Sub "Log in at http://${GuardrailsInstance.PublicIp}:8000 with user 'admin'. Your unique Server Hardware ID is displayed in the Licensing tab. Send this ID to piiguardrails@gmail.com for a permanent node-locked production key."
