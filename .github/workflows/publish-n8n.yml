name: Publish n8n Community Node to npm (with Provenance)

on:
  workflow_dispatch:
  push:
    tags:
      - 'n8n-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Mandatory for npm provenance & trusted publishing via Sigstore OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install
        working-directory: integrations/n8n-nodes-piiguardrails

      - name: Build node package
        run: npm run build
        working-directory: integrations/n8n-nodes-piiguardrails

      - name: Publish to npm with provenance via OIDC Trusted Publishing
        run: npm publish --provenance --access public
        working-directory: integrations/n8n-nodes-piiguardrails