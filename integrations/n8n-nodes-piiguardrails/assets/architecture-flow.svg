<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131D33"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="498" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 48)">
    <rect width="18" height="18" rx="4" fill="#06B6D4" opacity="0.2"/>
    <path d="M9 2 L16 5 L16 11 C16 15 9 18 9 18 C9 18 2 15 2 11 L2 5 Z" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <text x="30" y="15" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Enterprise PII Guardrails + n8n</text>
    <text x="320" y="15" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Zero-Leak AI Workflow Architecture</text>

    <!-- Badges -->
    <g transform="translate(760, -2)">
      <rect width="125" height="24" rx="12" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="14" y="16" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">&lt;25ms MASK/UNMASK</text>

      <rect x="135" width="135" height="24" rx="12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="149" y="16" fill="#34D399" font-family="monospace" font-size="11" font-weight="600">GDPR / HIPAA READY</text>
    </g>
  </g>

  <!-- Flow Connector Line -->
  <line x1="160" y1="210" x2="1040" y2="210" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- STEP 1: Inbound Payload -->
  <g transform="translate(60, 140)">
    <rect width="190" height="140" rx="12" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#F43F5E" fill-opacity="0.15"/>
    <text x="26" y="38" fill="#FB7185" font-size="16">📥</text>
    <text x="58" y="28" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">1. Customer Input</text>
    <text x="58" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Webhook / Chat</text>
    
    <rect x="16" y="62" width="158" height="60" rx="6" fill="#070A12" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="24" y="80" fill="#F87171" font-family="monospace" font-size="10" font-weight="600">⚠️ RAW PII INBOUND</text>
    <text x="24" y="96" fill="#CBD5E1" font-family="monospace" font-size="9">Name: Alice Smith</text>
    <text x="24" y="110" fill="#CBD5E1" font-family="monospace" font-size="9">MRN-998234, 4111-2222...</text>
  </g>

  <!-- Flow Arrow 1 -->
  <polygon points="265,206 275,210 265,214" fill="#06B6D4"/>

  <!-- STEP 2: Mask Node -->
  <g transform="translate(290, 130)">
    <rect width="200" height="160" rx="14" fill="url(#nodeGrad)" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#06B6D4" fill-opacity="0.2"/>
    <text x="25" y="39" fill="#38BDF8" font-size="18">🛡️</text>
    <text x="60" y="28" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">2. PII Guardrails</text>
    <text x="60" y="44" fill="#67E8F9" font-family="monospace" font-size="11">POST /mask</text>

    <rect x="16" y="66" width="168" height="74" rx="6" fill="#070A12" stroke="#06B6D4" stroke-opacity="0.3"/>
    <text x="24" y="84" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">⚡ LOCAL ENCLAVE</text>
    <text x="24" y="100" fill="#94A3B8" font-family="monospace" font-size="9">&gt; Detect Entities</text>
    <text x="24" y="114" fill="#94A3B8" font-family="monospace" font-size="9">&gt; Surrogate Map Gen</text>
    <text x="24" y="128" fill="#10B981" font-family="monospace" font-size="9">✔ Latency &lt;18ms</text>
  </g>

  <!-- Flow Arrow 2 -->
  <polygon points="505,206 515,210 505,214" fill="#8B5CF6"/>

  <!-- STEP 3: LLM Reasoning -->
  <g transform="translate(530, 140)">
    <rect width="200" height="140" rx="12" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.2"/>
    <text x="25" y="38" fill="#C084FC" font-size="16">🤖</text>
    <text x="58" y="28" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">3. Cloud / Local LLM</text>
    <text x="58" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">OpenAI / Claude / Ollama</text>

    <rect x="16" y="62" width="168" height="60" rx="6" fill="#070A12" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="24" y="80" fill="#A855F7" font-family="monospace" font-size="10" font-weight="600">🔒 SAFE TOKEN CONTEXT</text>
    <text x="24" y="96" fill="#CBD5E1" font-family="monospace" font-size="9">Prompt: [HUMAN_NAME_1]</text>
    <text x="24" y="110" fill="#CBD5E1" font-family="monospace" font-size="9">MRN: [MED_RECORD_1]</text>
  </g>

  <!-- Flow Arrow 3 -->
  <polygon points="745,206 755,210 745,214" fill="#10B981"/>

  <!-- STEP 4: Unmask Node -->
  <g transform="translate(770, 130)">
    <rect width="200" height="160" rx="14" fill="url(#nodeGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#10B981" fill-opacity="0.2"/>
