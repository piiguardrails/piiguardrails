    <text x="24" y="84" fill="#10B981" font-family="monospace" font-size="10" font-weight="600">⚡ RE-HYDRATION</text>
    <text x="24" y="100" fill="#94A3B8" font-family="monospace" font-size="9">&gt; In-Memory Map Lookup</text>
    <text x="24" y="114" fill="#94A3B8" font-family="monospace" font-size="9">&gt; Exact Value Restoration</text>
    <text x="24" y="128" fill="#10B981" font-family="monospace" font-size="9">✔ Latency &lt;5ms</text>
  </g>

  <!-- Flow Arrow 4 -->
  <polygon points="985,206 995,210 985,214" fill="#38BDF8"/>

  <!-- STEP 5: Delivery -->
  <g transform="translate(1010, 140)">
    <rect width="130" height="140" rx="12" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="25" y="38" fill="#34D399" font-size="16">📤</text>
    <text x="56" y="28" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">5. Output</text>
    <text x="56" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">End User</text>

    <rect x="14" y="62" width="102" height="60" rx="6" fill="#070A12" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="20" y="80" fill="#34D399" font-family="monospace" font-size="9" font-weight="600">✔ VERIFIED</text>
    <text x="20" y="96" fill="#94A3B8" font-family="monospace" font-size="8">Full Context</text>
    <text x="20" y="110" fill="#94A3B8" font-family="monospace" font-size="8">Zero Leakage</text>
  </g>

  <!-- Bottom Comparison Card -->
  <g transform="translate(60, 340)">
    <rect width="1080" height="110" rx="12" fill="#0B132B" fill-opacity="0.6" stroke="#1E293B" stroke-width="1"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700">WHAT EXTERNAL LLM SEES (ZERO LEAKAGE):</text>
      <rect x="0" y="24" width="500" height="42" rx="6" fill="#070A12" stroke="#334155"/>
      <text x="12" y="50" fill="#38BDF8" font-family="monospace" font-size="10">"Claim [MED_RECORD_1] for [HUMAN_NAME_1] on card [CARD_1]"</text>
    </g>

    <g transform="translate(556, 20)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700">WHAT YOUR USER RECEIVES (SEAMLESS):</text>
      <rect x="0" y="24" width="500" height="42" rx="6" fill="#070A12" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="12" y="50" fill="#34D399" font-family="monospace" font-size="10">"Claim MRN-998234 for Alice Smith on card 4111-2222..."</text>
    </g>
